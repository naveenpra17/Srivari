spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      data-source-properties:
        sslmode: require
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

logging:
  level:
    com.motors: INFO
    root: WARN

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://srivari-ui.vercel.app,https://*.vercel.app,http://localhost:4200,http://127.0.0.1:4200}
  site:
    frontend-url: ${SITE_FRONTEND_URL:https://srivari-ui.vercel.app}
    api-url: ${SITE_API_URL:https://srivari-1.onrender.com/api}
