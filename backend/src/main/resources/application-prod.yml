spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      data-source-properties:
        sslmode: require
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

logging:
  level:
    com.motors: INFO
    root: WARN
