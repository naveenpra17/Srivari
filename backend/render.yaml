services:
  - type: web
    name: motors-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/public/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://srivari-ui.vercel.app,https://*.vercel.app,http://localhost:4200
      - key: SITE_FRONTEND_URL
        value: https://srivari-ui.vercel.app
      - key: SITE_API_URL
        value: https://srivari-1.onrender.com/api
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_ADMIN
        sync: false
      - key: MAIL_SENDER_NAME
        value: Sri Vaari
