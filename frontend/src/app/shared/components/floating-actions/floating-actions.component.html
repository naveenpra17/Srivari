@if (chat.assistantVisible()) {
  <nav class="floating-actions" aria-label="Quick actions">
    @if (chat.isPanelOpen()) {
      <div
        class="help-panel"
        id="help-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="help-panel-title"
        aria-describedby="help-panel-desc">
        <div class="help-panel-header">
          <div>
            <p class="help-eyebrow">Sri Vaari Support</p>
            <h2 id="help-panel-title" class="help-title">{{ chat.greeting() }}</h2>
            <p id="help-panel-desc" class="help-subtitle">{{ chat.subheading() }}</p>
          </div>
          <button
            type="button"
            class="help-close"
            (click)="chat.closePanel()"
            aria-label="Close help panel">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="help-actions">
          <button type="button" class="help-action" (click)="chat.browseProducts()">
            <span class="help-action-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
              </svg>
            </span>
            <span class="help-action-text">
              <strong>Browse products</strong>
              <small>Explore motors, pumps, and more</small>
            </span>
          </button>

          <button type="button" class="help-action" (click)="chat.requestQuote()">
            <span class="help-action-icon quote" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
              </svg>
            </span>
            <span class="help-action-text">
              <strong>Request a quote</strong>
              <small>Share your requirements with our team</small>
            </span>
          </button>

          @if (chat.visible()) {
            <button type="button" class="help-action whatsapp" (click)="chat.openChat()">
              <span class="help-action-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
                  <path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.126 1.532 5.855L0 24l6.335-1.662A11.94 11.94 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/>
                </svg>
              </span>
              <span class="help-action-text">
                <strong>Chat on WhatsApp</strong>
                <small>Fast replies during business hours</small>
              </span>
            </button>
          }

          @if (chat.telLink()) {
            <a class="help-action call" [href]="chat.telLink()" (click)="chat.closePanel()">
              <span class="help-action-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                </svg>
              </span>
              <span class="help-action-text">
                <strong>Call us</strong>
                <small>{{ chat.companyPhone() }}</small>
              </span>
            </a>
          }
        </div>
      </div>
    }

    @if (showScrollTop()) {
      <button type="button" class="fab fab-scroll" (click)="scrollToTop()" aria-label="Back to top">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/>
        </svg>
      </button>
    }

    <button
      type="button"
      class="fab fab-help"
      [class.open]="chat.isPanelOpen()"
      (click)="chat.togglePanel()"
      [attr.aria-expanded]="chat.isPanelOpen()"
      aria-controls="help-panel"
      [attr.aria-label]="chat.isPanelOpen() ? 'Close help panel' : chat.tooltip()">
      @if (chat.isPanelOpen()) {
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      } @else {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.2L4 17.2V4h16v12z"/>
        </svg>
      }
      <span class="fab-label">Help</span>
    </button>
  </nav>
}
