<header class="header" [class.scrolled]="isScrolled()" [class.menu-open]="isMenuOpen()">
  <div class="container">
    <div class="header-inner">
      <a routerLink="/" class="logo" (click)="closeMenu()">
        <div class="logo-icon">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
            <circle cx="20" cy="20" r="8" fill="currentColor"/>
            <line x1="20" y1="2" x2="20" y2="12" stroke="currentColor" stroke-width="2"/>
            <line x1="20" y1="28" x2="20" y2="38" stroke="currentColor" stroke-width="2"/>
            <line x1="2" y1="20" x2="12" y2="20" stroke="currentColor" stroke-width="2"/>
            <line x1="28" y1="20" x2="38" y2="20" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <div class="logo-text">
          <span class="company-name">{{ settings()['company_name'] || 'Motors Industries' }}</span>
          <span class="tagline">Industrial Excellence</span>
        </div>
      </a>

      <nav class="nav-desktop">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
        <a routerLink="/testimonials" routerLinkActive="active">Testimonials</a>
        <a routerLink="/products" routerLinkActive="active">Categories</a>
        <a routerLink="/about" routerLinkActive="active">About</a>
        <a routerLink="/" fragment="contact" routerLinkActive="active">Contact</a>
        <a routerLink="/admin/login" class="admin-link">Login</a>
      </nav>

      <div class="header-actions">
        <button class="theme-toggle" (click)="theme.toggle()" [attr.aria-label]="theme.darkMode() ? 'Switch to light mode' : 'Switch to dark mode'">
          @if (theme.darkMode()) {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
          } @else {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.08-.88-.1-1.36-.1z"/></svg>
          }
        </button>
        <a [href]="'tel:' + (settings()['company_phone'] || '')" class="phone-btn" aria-label="Call us">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
          </svg>
          <span class="d-none d-md-inline">{{ settings()['company_phone'] || '+91-9876543210' }}</span>
        </a>
        <button class="hamburger" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen()" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </div>

  <nav class="nav-mobile" [class.open]="isMenuOpen()">
    <a routerLink="/" (click)="closeMenu()">Home</a>
    <a routerLink="/testimonials" (click)="closeMenu()">Testimonials</a>
    <a routerLink="/products" (click)="closeMenu()">Categories</a>
    <a routerLink="/about" (click)="closeMenu()">About</a>
    <a routerLink="/" fragment="contact" (click)="closeMenu()">Contact</a>
    <a routerLink="/admin/login" (click)="closeMenu()">Login</a>
  </nav>
</header>
