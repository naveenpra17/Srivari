<div class="admin-page-header">
  <h1>Categories</h1>
  <button class="btn-secondary-custom" (click)="openCreate()">+ Add Category</button>
</div>

@if (loading()) {
  <div class="loading-state">Loading...</div>
} @else {
  <div class="admin-card">
    <table class="admin-table">
      <thead>
        <tr><th>Name</th><th>Slug</th><th>Order</th><th>Status</th><th>Actions</th></tr>
      </thead>
      <tbody cdkDropList [cdkDropListData]="items()" (cdkDropListDropped)="onCategoryDrop($event)">
        @for (item of items(); track item.id) {
          <tr cdkDrag>
            <td>{{ item.name }}</td>
            <td>{{ item.slug }}</td>
            <td>{{ item.sortOrder }}</td>
            <td><span class="badge" [class.active]="item.active" [class.inactive]="!item.active">{{ item.active ? 'Active' : 'Inactive' }}</span></td>
            <td>
              <div class="admin-actions">
                <button class="btn-edit" (click)="openEdit(item)">Edit</button>
                <button class="btn-delete" (click)="deleteItem(item)">Delete</button>
              </div>
            </td>
            <td class="drag-handle-cell">
              <div class="drag-handle" cdkDragHandle aria-label="Drag to reorder">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 12h18M3 6h18M3 18h18"/>
                </svg>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}

@if (showModal()) {
  <div class="admin-modal-overlay" (click)="closeModal()">
    <div class="admin-modal" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>{{ editingId() ? 'Edit Category' : 'Add Category' }}</h2>
        <button class="close-btn" (click)="closeModal()">&times;</button>
      </div>
      <form class="modal-body admin-form" [formGroup]="form">
        <div class="form-group"><label>Name *</label><input formControlName="name"></div>
        <div class="form-group"><label>Description</label><textarea formControlName="description" rows="2"></textarea></div>
        <div class="form-group">
          <label>Image</label>
          <app-image-upload folder="categories" [imageUrl]="form.get('imageUrl')?.value || ''" (imageUrlChange)="form.patchValue({imageUrl: $event})" />
        </div>
        <div class="form-row">
          <div class="form-group"><label>Sort Order</label><input type="number" formControlName="sortOrder"></div>
          <div class="form-group checkbox-row"><input type="checkbox" formControlName="active" id="catActive"><label for="catActive">Active</label></div>
        </div>
      </form>
      <div class="modal-footer">
        <button class="btn-cancel" (click)="closeModal()">Cancel</button>
        <button class="btn-save" [disabled]="saving()" (click)="save()">{{ saving() ? 'Saving...' : 'Save' }}</button>
      </div>
    </div>
  </div>
}
