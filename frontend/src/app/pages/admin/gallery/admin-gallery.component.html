<div class="admin-page-header">
  <h1>Gallery</h1>
  <button class="btn-secondary-custom" (click)="openCreate()">+ Add Image</button>
</div>

@if (loading()) { <div class="loading-state">Loading...</div> }
@else {
  <div class="admin-card">
    <table class="admin-table">
      <thead><tr><th>Image</th><th>Title</th><th>Category</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>
        @for (item of items(); track item.id) {
          <tr>
            <td><img [src]="item.imageUrl" [alt]="item.title" class="thumb"></td>
            <td>{{ item.title }}</td>
            <td>{{ item.category || '—' }}</td>
            <td><span class="badge" [class.active]="item.active" [class.inactive]="!item.active">{{ item.active ? 'Active' : 'Inactive' }}</span></td>
            <td><div class="admin-actions"><button class="btn-edit" (click)="openEdit(item)">Edit</button><button class="btn-delete" (click)="deleteItem(item)">Delete</button></div></td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}

@if (showModal()) {
  <div class="admin-modal-overlay" (click)="closeModal()">
    <div class="admin-modal" (click)="$event.stopPropagation()">
      <div class="modal-header"><h2>{{ editingId() ? 'Edit' : 'Add' }} Gallery Item</h2><button class="close-btn" (click)="closeModal()">&times;</button></div>
      <form class="modal-body admin-form" [formGroup]="form">
        <div class="form-group"><label>Title *</label><input formControlName="title"></div>
        <div class="form-group"><label>Description</label><textarea formControlName="description" rows="2"></textarea></div>
        <div class="form-group"><label>Image *</label><app-image-upload folder="gallery" [imageUrl]="form.get('imageUrl')?.value || ''" (imageUrlChange)="form.patchValue({imageUrl: $event})" /></div>
        <div class="form-row">
          <div class="form-group"><label>Category</label><input formControlName="category" placeholder="Facility, Production..."></div>
          <div class="form-group"><label>Sort Order</label><input type="number" formControlName="sortOrder"></div>
        </div>
        <div class="form-group checkbox-row"><input type="checkbox" formControlName="active" id="galActive"><label for="galActive">Active</label></div>
      </form>
      <div class="modal-footer"><button class="btn-cancel" (click)="closeModal()">Cancel</button><button class="btn-save" [disabled]="saving()" (click)="save()">Save</button></div>
    </div>
  </div>
}
