<div class="admin-page-header">
  <h1>My Profile</h1>
</div>

<div class="row g-4">
  <div class="col-lg-6">
    <div class="admin-card" style="padding: 1.5rem">
      <h3 style="color: var(--primary); font-size: 1rem; margin-bottom: 1rem">Profile Information</h3>
      <p class="text-muted mb-3" style="font-size: 0.9rem">
        Logged in as <strong>{{ auth.user()?.email }}</strong>
        <span class="badge active ms-2">{{ auth.user()?.roles?.join(', ') }}</span>
      </p>
      <form class="admin-form" [formGroup]="profileForm" (ngSubmit)="saveProfile()">
        <div class="form-row">
          <div class="form-group"><label>First Name *</label><input formControlName="firstName"></div>
          <div class="form-group"><label>Last Name *</label><input formControlName="lastName"></div>
        </div>
        <div class="form-group"><label>Phone</label><input formControlName="phone"></div>
        <div class="form-group">
          <label>Avatar</label>
          <app-image-upload folder="avatars" [imageUrl]="profileForm.get('avatarUrl')?.value || ''"
            (imageUrlChange)="profileForm.patchValue({avatarUrl: $event})" />
        </div>
        <button type="submit" class="btn-save" [disabled]="savingProfile()">
          {{ savingProfile() ? 'Saving...' : 'Save Profile' }}
        </button>
      </form>
    </div>
  </div>

  <div class="col-lg-6">
    <div class="admin-card" style="padding: 1.5rem">
      <h3 style="color: var(--primary); font-size: 1rem; margin-bottom: 1rem">Change Password</h3>
      <form class="admin-form" [formGroup]="passwordForm" (ngSubmit)="changePassword()">
        <div class="form-group"><label>Current Password *</label><input type="password" formControlName="currentPassword"></div>
        <div class="form-group"><label>New Password *</label><input type="password" formControlName="newPassword"></div>
        <div class="form-group"><label>Confirm Password *</label><input type="password" formControlName="confirmPassword"></div>
        <button type="submit" class="btn-save" [disabled]="savingPassword()">
          {{ savingPassword() ? 'Updating...' : 'Change Password' }}
        </button>
      </form>
    </div>
  </div>
</div>
