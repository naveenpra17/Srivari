<section class="gallery-industrial" id="gallery">
  <div class="container">
    <app-section-header
      title="Our Gallery"
      subtitle="A glimpse into our manufacturing facilities, products and engineering excellence."
      eyebrow="Gallery" />

    <div class="gallery-masonry" appReveal>
      @for (item of displayItems(); track item.id; let i = $index) {
        <button
          type="button"
          class="gallery-item"
          [class]="'gallery-item item-' + (i % 6)"
          (click)="openLightbox(item)"
          [attr.aria-label]="'View ' + item.title">
          <img [src]="item.imageUrl" alt="" loading="lazy" width="400" height="300">
          <span class="gallery-overlay">
            <span class="zoom" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </span>
            <span class="title">{{ item.title }}</span>
          </span>
        </button>
      }
    </div>
  </div>

  @if (selected()) {
    <div class="lightbox" role="dialog" aria-modal="true" [attr.aria-label]="selected()!.title" (click)="closeLightbox()">
      <button type="button" class="lightbox-close" (click)="closeLightbox()" aria-label="Close gallery">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      <img [src]="selected()!.imageUrl" [alt]="selected()!.title" (click)="$event.stopPropagation()">
      <div class="lightbox-caption" (click)="$event.stopPropagation()">
        <h3>{{ selected()!.title }}</h3>
        @if (selected()!.description) {
          <p>{{ selected()!.description }}</p>
        }
      </div>
    </div>
  }
</section>
