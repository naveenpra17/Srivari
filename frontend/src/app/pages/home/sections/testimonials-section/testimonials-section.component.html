<section class="testimonials-industrial" id="testimonials">
  <div class="container">
    <app-section-header
      title="What Our Clients Say"
      subtitle="Trusted by industry leaders across manufacturing, energy and infrastructure."
      eyebrow="Testimonials"
      link="/testimonials"
      linkLabel="View All" />

    <div class="swiper testimonial-swiper" #testimonialSwiper>
      <div class="swiper-wrapper">
        @for (item of items(); track item.id) {
          <div class="swiper-slide">
            <article class="testimonial-card" appReveal [appRevealDelay]="$index * 100">
              <div class="testimonial-top">
                <img
                  [src]="item.imageUrl || 'https://images.unsplash.com/photo-1560250097-0b93528c311a?w=120&q=80'"
                  [alt]="item.clientName"
                  loading="lazy"
                  width="64"
                  height="64">
                <app-star-rating [rating]="item.rating" />
              </div>
              <blockquote>"{{ item.content }}"</blockquote>
              <footer>
                <strong>{{ item.clientName }}</strong>
                @if (item.designation || item.company) {
                  <span>{{ formatRole(item) }}</span>
                }
              </footer>
            </article>
          </div>
        }
      </div>

      @if (items().length > 1) {
        <button type="button" class="testimonial-nav-prev" aria-label="Previous testimonial">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <button type="button" class="testimonial-nav-next" aria-label="Next testimonial">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
        <div class="testimonial-pagination" role="tablist" aria-label="Testimonial slides"></div>
      }
    </div>
  </div>
</section>
