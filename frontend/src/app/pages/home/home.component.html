<main class="home-industrial">
  @if (loading()) {
    <div class="home-skeleton" aria-hidden="true">
      <div class="skeleton skeleton-hero"></div>
      <div class="container">
        <div class="skeleton skeleton-title"></div>
        <div class="row g-3">
          <div class="col-6 col-lg-3"><div class="skeleton skeleton-card"></div></div>
          <div class="col-6 col-lg-3"><div class="skeleton skeleton-card"></div></div>
          <div class="col-6 col-lg-3"><div class="skeleton skeleton-card"></div></div>
          <div class="col-6 col-lg-3"><div class="skeleton skeleton-card"></div></div>
        </div>
      </div>
    </div>
  } @else if (error()) {
    <section class="container section text-center" role="alert">
      <h1>We couldn’t load the website content</h1>
      <p class="text-muted">Please check your connection and try again.</p>
      <button type="button" class="btn-secondary-custom" (click)="retry()">Try again</button>
    </section>
  } @else {
    <app-hero-section [slides]="data()?.heroSlides ?? []" />
    <app-categories-section [categories]="data()?.categories ?? []" />
    <app-stats-section [settings]="data()?.settings ?? {}" />
    <app-about-section [settings]="data()?.settings ?? {}" />
    <app-industries-section [industries]="data()?.industries ?? []" />
    <app-testimonials-section [testimonials]="data()?.testimonials ?? []" />
    <app-gallery-section [items]="data()?.gallery ?? []" />
    <app-contact-section [settings]="data()?.settings ?? {}" />
  }
</main>
